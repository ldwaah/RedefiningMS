<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070605" />
    <title>Logo intro demo | The Rebuilding Room</title>
    <style>
      :root {
        --bg: #000000;
        --ink: rgba(245, 237, 223, 0.92);
        --gold: rgba(211, 176, 108, 0.78);
        --gold-soft: rgba(211, 176, 108, 0.42);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
      }

      .wrap {
        min-height: 100%;
        display: grid;
        align-content: end;
        justify-items: center;
        padding: 24px;
        padding-bottom: max(clamp(3rem, 14vh, 7.5rem), env(safe-area-inset-bottom, 0px));
      }

      .stage {
        position: relative;
        width: min(62vw, 520px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
      }

      .logo {
        position: relative;
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: translateY(2px) scale(0.992);
        filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0));
        transition: opacity 600ms var(--ease), transform 900ms var(--ease);
        will-change: opacity, transform, filter;
      }

      .logo__clip {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* start fully hidden, then reveal upward */
        clip-path: inset(100% 0% 0% 0% round 0px);
        will-change: clip-path;
      }

      .logo__clip img {
        width: 100%;
        height: 100%;
        display: block;
        transform: translateY(6%);
        /* soften the reveal edge slightly */
        -webkit-mask-image: linear-gradient(
          to top,
          rgba(0, 0, 0, 1) 0%,
          rgba(0, 0, 0, 1) 82%,
          rgba(0, 0, 0, 0) 100%
        );
        mask-image: linear-gradient(
          to top,
          rgba(0, 0, 0, 1) 0%,
          rgba(0, 0, 0, 1) 82%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /*
        The source "icon.svg" is a raster image embedded in SVG (base64 PNG),
        so we simulate a "path draw" feeling with a soft mask + shimmer grain.
      */
      .logo::before {
        content: "";
        position: absolute;
        inset: -14%;
        background:
          radial-gradient(60% 60% at 50% 45%, rgba(245, 237, 223, 0.08), rgba(0, 0, 0, 0) 62%),
          radial-gradient(70% 70% at 50% 50%, rgba(211, 176, 108, 0.09), rgba(0, 0, 0, 0) 64%);
        opacity: 0;
        filter: blur(18px);
        transform: scale(0.98);
        transition: opacity 900ms var(--ease), transform 1200ms var(--ease);
        pointer-events: none;
      }

      .logo::after {
        content: "";
        position: absolute;
        inset: -10%;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        background:
          radial-gradient(80% 80% at 45% 40%, rgba(245, 237, 223, 0.14), rgba(0, 0, 0, 0) 58%),
          radial-gradient(90% 90% at 55% 55%, rgba(211, 176, 108, 0.14), rgba(0, 0, 0, 0) 66%),
          repeating-linear-gradient(
            115deg,
            rgba(245, 237, 223, 0.00) 0px,
            rgba(245, 237, 223, 0.00) 10px,
            rgba(245, 237, 223, 0.05) 12px,
            rgba(245, 237, 223, 0.00) 18px
          );
        filter: blur(9px);
        transform: translateY(0px);
      }

      .controls {
        position: fixed;
        left: 18px;
        right: 18px;
        bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .volume-hint {
        position: fixed;
        left: 50%;
        top: 56%;
        transform: translate(-50%, -50%);
        color: rgba(245, 237, 223, 0.72);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(211, 176, 108, 0.10);
        opacity: 0;
        pointer-events: none;
        transition: opacity 500ms var(--ease);
      }

      .is-running .volume-hint {
        opacity: 1;
      }

      .is-running .volume-hint.is-hidden {
        opacity: 0;
      }

      .is-running .volume-hint .type {
        display: inline-block;
        white-space: nowrap;
        overflow: hidden;
        width: 0ch;
        animation: type-on 1200ms steps(18, end) 0ms forwards;
      }

      @keyframes type-on {
        from {
          width: 0ch;
        }
        to {
          width: 18ch; /* "TURN ON VOLUME..." */
        }
      }

      .btn {
        border: 1px solid rgba(245, 237, 223, 0.18);
        background: rgba(18, 16, 14, 0.55);
        color: var(--ink);
        padding: 12px 14px;
        border-radius: 999px;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: transform 120ms var(--ease), background 180ms var(--ease),
          border-color 180ms var(--ease);
        backdrop-filter: blur(12px);
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: rgba(211, 176, 108, 0.42);
        background: rgba(26, 22, 19, 0.62);
      }

      .hint {
        font-size: 12px;
        color: rgba(245, 237, 223, 0.62);
        line-height: 1.3;
        text-align: right;
      }

      .hint code {
        color: rgba(211, 176, 108, 0.92);
      }

      .is-running .logo {
        animation: breathe 12.5s ease-in-out infinite;
      }

      /* pure black for first ~9s */
      .is-running .logo {
        animation-delay: 0s;
      }

      .is-running .logo::before {
        animation: aura 18s ease-in-out infinite;
        animation-delay: 9s;
      }

      .is-running .logo::after {
        animation: ink 22s ease-in-out infinite;
        animation-delay: 9s;
      }

      .is-running .logo[data-phase="visible"] {
        opacity: 1;
        transform: translateY(0px) scale(1);
        filter:
          drop-shadow(0 0 18px rgba(211, 176, 108, 0.10))
          drop-shadow(0 0 42px rgba(245, 237, 223, 0.06));
      }

      .is-running .logo[data-phase="visible"]::before {
        opacity: 1;
        transform: scale(1);
      }

      .is-running .logo[data-phase="visible"]::after {
        opacity: 0.55;
      }

      .is-running .logo[data-phase="visible"] .logo__clip {
        animation: draw-up 78s var(--ease) 0s forwards;
      }

      @keyframes breathe {
        0% {
          transform: translateY(0px) scale(1);
        }
        50% {
          transform: translateY(-1px) scale(1.006);
        }
        100% {
          transform: translateY(0px) scale(1);
        }
      }

      @keyframes aura {
        0% {
          opacity: 0.0;
          filter: blur(20px);
        }
        35% {
          opacity: 0.85;
          filter: blur(18px);
        }
        70% {
          opacity: 0.62;
          filter: blur(22px);
        }
        100% {
          opacity: 0.75;
          filter: blur(19px);
        }
      }

      @keyframes ink {
        0% {
          opacity: 0.0;
          transform: translateY(0px);
        }
        20% {
          opacity: 0.36;
          transform: translateY(-0.5px);
        }
        45% {
          opacity: 0.60;
          transform: translateY(0.2px);
        }
        70% {
          opacity: 0.44;
          transform: translateY(-0.3px);
        }
        100% {
          opacity: 0.55;
          transform: translateY(0px);
        }
      }

      @keyframes draw-up {
        0% {
          clip-path: inset(100% 0% 0% 0% round 0px);
        }
        12% {
          clip-path: inset(82% 0% 0% 0% round 0px);
        }
        28% {
          clip-path: inset(62% 0% 0% 0% round 0px);
        }
        46% {
          clip-path: inset(38% 0% 0% 0% round 0px);
        }
        68% {
          clip-path: inset(14% 0% 0% 0% round 0px);
        }
        100% {
          clip-path: inset(0% 0% 0% 0% round 0px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .is-running .logo,
        .is-running .logo::before,
        .is-running .logo::after {
          animation: none !important;
        }

        .is-running .logo[data-phase="visible"] .logo__clip {
          animation: none !important;
          clip-path: inset(0% 0% 0% 0% round 0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="application" aria-label="Logo intro demo">
      <div class="stage" aria-hidden="true">
        <div class="logo" id="logo" aria-hidden="true">
          <div class="logo__clip" aria-hidden="true">
            <img src="icon copy.svg" alt="" draggable="false" />
          </div>
        </div>
      </div>
    </div>

    <div class="volume-hint" id="volume-hint" aria-live="polite">
      <span class="type">Turn on volume...</span>
    </div>

    <div class="controls">
      <button class="btn" id="start">Start demo</button>
      <div class="hint">
        Expects <code>rebuildingroom.m4a</code> in <code>the-rebuilding-room/</code><br />
        Uses <code>icon copy.svg</code> in this folder.
      </div>
    </div>

    <script>
      const logoEl = document.getElementById("logo");
      const startBtn = document.getElementById("start");
      const volumeHintEl = document.getElementById("volume-hint");

      const playIntro = async () => {
        document.documentElement.classList.add("is-running");

        const audio = new Audio("rebuildingroom.m4a");
        audio.preload = "auto";
        audio.volume = 0;

        try {
          await audio.play();
        } catch (err) {
          // If playback is blocked, still show the visual timing.
        }

        // Keep it completely black for ~9 seconds.
        window.setTimeout(() => {
          logoEl.dataset.phase = "visible";
        }, 9000);

        // Gentle volume fade-in after 1s (once audio has started).
        window.setTimeout(() => {
          audio.volume = 1;
        }, 1000);

        // Show "Turn on volume" for ~3s, then fade away.
        window.setTimeout(() => {
          volumeHintEl?.classList.add("is-hidden");
        }, 3000);
      };

      let started = false;
      startBtn.addEventListener("click", async () => {
        if (started) return;
        started = true;
        startBtn.textContent = "Playing...";
        startBtn.setAttribute("disabled", "true");

        await playIntro();
      });
    </script>
  </body>
</html>
